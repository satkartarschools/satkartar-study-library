<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect x="25" y="20" width="650" height="110" rx="28" fill="url(#g)" filter="url(#shadow)">
    <animate attributeName="opacity" values="1;0.45;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="350" y="92" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="700" fill="#ffffff">
    ENTER LEARNING HUB
    <animate attributeName="opacity" values="1;0.45;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>